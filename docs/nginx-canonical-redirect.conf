# Configuración de nginx para https://agenciamanglar.mx/
#
# Objetivo SEO: que cada página responda en una sola URL (https, sin www, con "/" final),
# igual que las canónicas y el sitemap. Todo lo demás redirige con 301.
#
#   http://agenciamanglar.mx/...        -> https://agenciamanglar.mx/...
#   http(s)://www.agenciamanglar.mx/... -> https://agenciamanglar.mx/...
#   https://agenciamanglar.mx/gestion-shein -> https://agenciamanglar.mx/gestion-shein/
#
# Ajusta rutas de certificados y `root` a tu servidor. Prueba con `nginx -t` antes de recargar.

# 1) HTTP (con y sin www) -> HTTPS sin www
server {
    listen 80;
    listen [::]:80;
    server_name agenciamanglar.mx www.agenciamanglar.mx;

    return 301 https://agenciamanglar.mx$request_uri;
}

# 2) HTTPS con www -> HTTPS sin www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.agenciamanglar.mx;

    ssl_certificate /etc/letsencrypt/live/agenciamanglar.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agenciamanglar.mx/privkey.pem;

    return 301 https://agenciamanglar.mx$request_uri;
}

# 3) Sitio canónico
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agenciamanglar.mx;

    ssl_certificate /etc/letsencrypt/live/agenciamanglar.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agenciamanglar.mx/privkey.pem;

    root /var/www/manglar/dist;
    index index.html;

    # Redirecciones relativas: evita que nginx agregue puerto o esquema incorrecto
    # al redirigir /gestion-shein -> /gestion-shein/.
    absolute_redirect off;

    # HSTS: activar solo cuando HTTPS funcione bien en todo el dominio.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # /index.html y /pagina/index.html -> URL limpia con "/" final
    # Usar la petición original: $uri también cambia al resolver el índice interno.
    if ($request_uri ~ "^(.*/)index\.html(?:\?|$)") {
        return 301 $1$is_args$args;
    }

    # Si /gestion-shein es un directorio, nginx responde 301 a /gestion-shein/ (relativo por absolute_redirect off).
    location / {
        try_files $uri $uri/ =404;
    }

    # Recursos con hash de Astro: caché larga e inmutable
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
}
